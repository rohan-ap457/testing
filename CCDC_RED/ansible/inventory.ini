# Competition hosts. The password is in group_vars/all/vault.yml, not here.
# To give one host its own config, add  sshd_config_src=/path/to/file  to its line.
#
# The OS of each host is a guess from its name. If a host is something else,
# move its line to the right group below.

# Linux with systemd (Ubuntu, Debian, Rocky, Fedora, RHEL)
[linux]
dns       ansible_host=192.168.4.193
web       ansible_host=192.168.4.194
database  ansible_host=192.168.4.195
mail      ansible_host=192.168.4.196
files     ansible_host=192.168.4.197
logs      ansible_host=192.168.4.199
monitor   ansible_host=192.168.4.200
jumpbox   ansible_host=192.168.4.201

# Alpine (OpenRC). Move a host here if it is Alpine; it needs python3:  apk add python3
[alpine]

# Everything deploy.yml installs the watcher on.
[deploy_targets:children]
linux
alpine

# Not used by deploy.yml (no sshd_config to guard).
[windows]
dc        ansible_host=192.168.4.191

# Not used by deploy.yml.
[network_gear]
firewall  ansible_host=192.168.4.192

# Not used by deploy.yml until you confirm its OS. If it is a modern systemd
# Linux, move it to [linux]. An old one may lack python3 or systemd.
[unconfirmed]
legacy    ansible_host=192.168.4.198

[deploy_targets:vars]
ansible_user=blueteam
ansible_password="{{ vault_password }}"
ansible_become=True
ansible_become_method=sudo
ansible_become_password="{{ vault_password }}"
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

[alpine:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_become_method=doas

# For a domain controller the user may need to be DOMAIN\blueteam.
[windows:vars]
ansible_user=blueteam
ansible_password="{{ vault_password }}"
ansible_connection=winrm
ansible_port=5985
ansible_winrm_scheme=http
ansible_winrm_transport=ntlm
